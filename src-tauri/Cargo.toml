[package]
name = "pulsarviewer"
version = "3.0.17"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [ "shell-sidecar", "shell-open", "process-command-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
