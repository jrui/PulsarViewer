[package]
name = "pulsarviewer"
version = "3.0.23"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [ "shell-sidecar", "shell-open", "process-command-api", "process-relaunch", "updater", "dialog-save"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# Used directly (instead of tauri::api::dialog) for save_export_file: tauri's blocking
# dialog wrapper shows the panel as an async NSSavePanel sheet on macOS, which can hang
# the app when the completion handler never fires under tao's custom event loop. Calling
# rfd::FileDialog's synchronous runModal API directly avoids that async sheet/GCD path.
rfd = "0.10"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
