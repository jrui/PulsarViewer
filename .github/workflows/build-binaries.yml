name: Build and Release Tauri Desktop App

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v2.0.5)'
        required: true
        type: string

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            pr_bundles: dmg,app
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pr_bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pr_bundles: msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Rust target (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Install Rust target (Windows)
        if: matrix.os == 'windows-latest'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libsoup2.4-dev

      - name: Build Go backend (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          cd src/backend
          GOOS=darwin GOARCH=amd64 go build -o pulsarviewer-backend-x86_64-apple-darwin ./cmd/main.go
          GOOS=darwin GOARCH=arm64 go build -o pulsarviewer-backend-aarch64-apple-darwin ./cmd/main.go
          chmod +x pulsarviewer-backend-x86_64-apple-darwin pulsarviewer-backend-aarch64-apple-darwin
          # Tauri's universal build expects both per-arch sidecar binaries; lipo universal is optional
          lipo -create pulsarviewer-backend-x86_64-apple-darwin pulsarviewer-backend-aarch64-apple-darwin -output pulsarviewer-backend-universal-apple-darwin
          chmod +x pulsarviewer-backend-universal-apple-darwin

      - name: Build Go backend (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd src/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o pulsarviewer-backend-x86_64-unknown-linux-gnu ./cmd/main.go
          chmod +x pulsarviewer-backend-x86_64-unknown-linux-gnu

      - name: Build Go backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src/backend
          $env:GOOS="windows"; $env:GOARCH="amd64"; $env:CGO_ENABLED="0"; go build -o pulsarviewer-backend-x86_64-pc-windows-msvc.exe ./cmd/main.go

      - name: Install npm dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npx @tauri-apps/cli icon src/backend/public/pulsar_viewer_logo.png

      - name: Build Tauri app (pull request)
        if: github.event_name == 'pull_request'
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.pr_bundles }}

      # Only build+publish a release on tag push or manual dispatch; PRs validate build only.
      # tauri-action builds the app, generates the updater manifest (latest.json) and the signed
      # updater archives (.app.tar.gz/.sig, .AppImage.tar.gz/.sig, .msi.zip/.sig), and uploads them
      # together with the plain installers to the GitHub Release — merging into the same
      # latest.json across this matrix's macOS/Linux/Windows jobs so the Tauri updater endpoint
      # (releases/latest/download/latest.json) actually resolves.
      - name: Build and publish Tauri app (tag/dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
