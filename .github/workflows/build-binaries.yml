name: Build and Release Tauri Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v2.0.5)'
        required: true
        type: string

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifact_name: PulsarViewer_universal.dmg
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pulsarviewer_amd64.AppImage
            artifact_path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: PulsarViewer_x64_en-US.msi
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Rust target (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Install Rust target (Windows)
        if: matrix.os == 'windows-latest'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Build Go backend (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          cd src/backend
          GOOS=darwin GOARCH=amd64 go build -o pulsarviewer-backend-x86_64-apple-darwin ./cmd/main.go
          GOOS=darwin GOARCH=arm64 go build -o pulsarviewer-backend-aarch64-apple-darwin ./cmd/main.go
          lipo -create pulsarviewer-backend-x86_64-apple-darwin pulsarviewer-backend-aarch64-apple-darwin -output pulsarviewer-backend-universal-apple-darwin
          rm pulsarviewer-backend-x86_64-apple-darwin pulsarviewer-backend-aarch64-apple-darwin
          chmod +x pulsarviewer-backend-universal-apple-darwin

      - name: Build Go backend (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd src/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o pulsarviewer-backend-x86_64-unknown-linux-gnu ./cmd/main.go
          chmod +x pulsarviewer-backend-x86_64-unknown-linux-gnu

      - name: Build Go backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src/backend
          $env:GOOS="windows"; $env:GOARCH="amd64"; $env:CGO_ENABLED="0"; go build -o pulsarviewer-backend-x86_64-pc-windows-msvc.exe ./cmd/main.go

      - name: Install npm dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npx @tauri-apps/cli icon public/pulsar_viewer_logo.png

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.artifact_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
