<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>Pulsar Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="pulsar_viewer_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash-screen">
    <img src="pulsar_viewer_logo.png" alt="Pulsar Viewer" class="splash-logo" />
  </div>
  <div id="layout" class="hidden">
  <section id="controls">
    <form id="connect-form" class="panel">
      <button type="button" id="collapseBtn" class="collapse-btn" title="Collapse">‹</button>
      <button type="button" id="expandBtn" class="expand-btn" title="Expand">›</button>
      <div class="field connection-manager">
        <label>Saved Connections</label>
        <select id="savedConnections">
          <option value="">-- Select a saved connection --</option>
        </select>
      </div>
      <div class="field">
        <label>Service URL</label>
        <input type="text" id="serviceUrl" placeholder="pulsar://localhost:6650" required />
      </div>
      <div class="field">
        <label>Topic</label>
        <input type="text" id="topic" placeholder="persistent://public/default/my-topic" required />
      </div>
      <div class="field">
        <label>Token (optional)</label>
        <input type="password" id="token" placeholder="Paste JWT token" />
        </div>
      <div class="field">
        <label>Subscription Type</label>
        <select id="subscriptionType">
          <option value="Exclusive">Exclusive</option>
          <option value="Shared">Shared</option>
          <option value="Failover">Failover</option>
          <option value="KeyShared">KeyShared</option>
        </select>
      </div>
      <div class="field">
        <label>Initial Position</label>
        <select id="initialPosition">
          <option value="latest">Latest</option>
          <option value="earliest">Earliest</option>
        </select>
      </div>
      <div class="field">
        <label>Subscription Name</label>
        <input type="text" id="subscription" value="viewer-sub" />
      </div>
      <div class="actions">
        <button type="submit" id="connectBtn">Connect</button>
        <button type="button" id="disconnectBtn" disabled>Disconnect</button>
        <div style="flex: 1;"></div>
        <button type="button" id="saveConnectionBtn" title="Save current connection">Save Connection</button>
        <button type="button" id="deleteConnectionBtn" title="Delete selected connection" style="background: linear-gradient(135deg, #f63b8c 0%, #721010 100%); color: white; margin-left: 0.5rem; border: 1px solid #721010;">Delete</button>
      </div>
    </form>
  </section>
  </div>
  <div id="layout2">
    <aside id="send-panel" class="panel">
    <h2>📤 Send Message</h2>
    <small class="text-muted" style="display:block;margin-bottom:1rem;">Uses the same Service URL / Topic / Token from the connection form above.</small>
    <form id="send-form">
      <div class="field-inline">
        <label>Key</label>
        <input type="text" id="sendKey" />
      </div>
      <div class="field">
        <label>Properties (JSON)</label>
        <textarea id="sendProps" rows="2" placeholder='{"foo":"bar"}'></textarea>
      </div>
      <div class="field">
        <label>Payload</label>
        <textarea id="sendPayload" rows="6" placeholder='{"example":true}' required></textarea>
      </div>
      <div class="actions">
        <button type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </aside>
  </div>
  <div id="layout3">
    <section id="messages-section" class="panel">
        <h2>📨 Messages</h2>
        <div class="filter-container">
          <label>Filter</label>
          <input id="filter" placeholder="filter (show only messages containing this)" />
          <label class="checkbox"><input type="checkbox" id="useRegex" /> Use Regex</label>
        </div>
      <div id="messages"></div>
    </section>
  </div>
  <footer>
    <small>Made with ❤️ by <a href="https://www.linkedin.com/in/jrui/" target="_blank" style="color: white;">jrui</a> • Lightweight message inspector with live streaming • <a href="https://github.com/jrui/PulsarViewer/releases/latest" target="_blank" style="color: white;">Download desktop apps</a></small>
  </footer>

  <!-- Modal for connection label -->
  <div id="labelModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center;">
    <div style="background: var(--color-bg-secondary); border: 1px solid var(--color-border-primary); border-radius: 8px; padding: 2rem; box-shadow: 0 20px 25px rgba(0,0,0,0.6); min-width: 300px;">
      <h3 style="margin: 0 0 1rem 0; color: var(--color-text-primary);">Save Connection</h3>
      <input type="text" id="labelModalInput" placeholder="e.g., Production, Dev Environment" style="width: 100%; padding: 0.65rem; margin-bottom: 1rem; border: 1px solid var(--color-border-secondary); border-radius: 6px; background: var(--color-bg-primary); color: var(--color-text-primary); font-family: inherit;" />
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button id="labelModalCancel" type="button" style="padding: 0.65rem 1rem; border: 1px solid var(--color-border-secondary); border-radius: 6px; background: var(--color-bg-primary); color: var(--color-text-primary); cursor: pointer;">Cancel</button>
        <button id="labelModalSave" type="button" style="padding: 0.65rem 1rem; border: 1px solid var(--color-accent-primary); border-radius: 6px; background: var(--color-accent-primary); color: white; cursor: pointer; font-weight: 600;">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
